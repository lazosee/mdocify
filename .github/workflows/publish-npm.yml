name: Publish NPM Package
on:
    release:
        types:
            - published
jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        steps:
            - uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "22.x"
                  registry-url: "https://registry.npmjs.org/"
            - run: npm install
            - run: npm run prepack
            - run: npm publish --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
